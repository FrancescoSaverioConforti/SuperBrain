[package]
name = "brain-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain Brain API orchestration layer: read delegation, write-proposal lifecycle, approval-gated execution."

[features]
# Forwards api's own dense-retrieval feature (B4.1) unchanged -- brain-api
# itself has no dense-retrieval-specific code of its own (its read.rs
# delegates to api::search unmodified); this entry exists purely so a
# caller building brain-api with the feature enabled gets the real
# ONNX/embedding dependencies linked through the same chain api itself
# already defines, without brain-api inventing a second meaning for the
# name.
dense-retrieval = ["api/dense-retrieval"]

[dependencies]
api = { path = "../api" }
storage = { path = "../storage" }
policy = { path = "../policy" }
domain = { path = "../domain" }
index = { path = "../index" }
codegraph-index = { path = "../codegraph-index" }
codegraph-domain = { path = "../codegraph-domain" }
# M6.2B: the pure hash-chain/record-envelope primitives that used to
# live in this crate's own audit_chain.rs/audit_record.rs (B5 remediation
# M5 Tasks 1/4), extracted so a future MCP Client audit payload can use
# the same format without depending on brain-api. This crate's own
# audit.rs re-exports a curated facade over this dependency; callers of
# brain-api are unaffected (same public names/signatures, proven by
# M6.2A's golden-vector suite run unchanged against the extracted code).
audit-chain-core = { path = "../audit-chain-core" }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"

[dev-dependencies]
git2 = "0.21"
# M5 Task 7: used ONLY by examples/approve_cli.rs (the real composition
# root) to construct the dedicated audit writer worker and bridge its
# async record_durable(...) calls to run_cli_durable's own synchronous,
# trust-blind hooks -- never by this crate's own library code, which
# stays exactly as Tokio-free as before this task (run_cli/
# run_cli_with_audit/run_cli_durable are all still plain, synchronous
# functions; DurableApprovalHooks's own closures are plain FnMut, no
# Future/async anywhere in brain-api's own public API). A dev-dependency
# (not [dependencies]), the same "an [[example]] target is built with
# [dependencies] + [dev-dependencies] available" mechanism
# `mcp-server/Cargo.toml`'s own identical M5 Task 6 comment already
# documents for its own serve_stdio example.
brain-api-audit-worker = { path = "../brain-api-audit-worker" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
