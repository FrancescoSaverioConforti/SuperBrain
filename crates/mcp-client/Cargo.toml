[package]
name = "mcp-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain MCP client: connects to external MCP servers under SuperBrain's own permission gate (B5.8+). Never reaches brain-api/storage -- the reverse direction of crates/mcp-server."

[dependencies]
# Official Rust MCP SDK (modelcontextprotocol/rust-sdk) -- the same crate
# Task 21 chose for mcp-server, now used in CLIENT mode. `client` is the
# client-role protocol logic (Peer::call_tool/list_tools, ServiceExt::serve
# for RoleClient); `transport-child-process` is the realistic way to
# connect to a real external MCP server: spawn it as a child process and
# speak MCP over its stdio, the standard shape for a locally-registered
# MCP tool (the same shape e.g. `npx @some/mcp-server` would take).
rmcp = { version = "3.11.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# M6.6: creation-time Job Object containment for spawned external MCP
# server child processes (windows_job.rs). Same windows crate version
# already used by mcp-client-cli/storage/vault-security. Win32_System_
# JobObjects: CreateJobObjectW/SetInformationJobObject/
# AssignProcessToJobObject/TerminateJobObject/IsProcessInJob.
# Win32_System_Threading: CreateProcessW/STARTUPINFOEXW/
# InitializeProcThreadAttributeList/UpdateProcThreadAttribute/
# PROC_THREAD_ATTRIBUTE_JOB_LIST/PROC_THREAD_ATTRIBUTE_HANDLE_LIST
# (creation-time job assignment + inherited-handle restriction, avoiding
# both the ordinary-spawn-then-assign race and over-broad handle
# inheritance). Win32_System_Pipes: CreatePipe, replacing
# `tokio::process::Command`'s own stdio piping (bypassed here because it
# offers no way to call CreateProcessW directly with an attribute list).
# Win32_Security: SECURITY_ATTRIBUTES (pipe inheritance control).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
