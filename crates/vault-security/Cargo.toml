[package]
name = "vault-security"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain encrypted PII vault, deletion log and backup (scaffold)."

[dependencies]
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
getrandom = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
hkdf = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
