[package]
name = "mcp-audit-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain M7: the sole cross-boundary convergence point translating a verified MCP client audit chain (mcp-client-audit-worker) into additive brain_api::AuditEventKind facts, durably appended via brain-api-audit-worker. Batch/offline, idempotent via a bridge-owned checkpoint. Depends on mcp-client-audit-worker, brain-api, brain-api-audit-worker, audit-chain-core and storage (to open the source vault read-only) -- mcp-client, mcp-client-audit-worker and brain-api themselves stay dependency-isolated from each other; this crate is the only place that may depend on both sides."

[dependencies]
mcp-client-audit-worker = { path = "../mcp-client-audit-worker" }
brain-api = { path = "../brain-api" }
brain-api-audit-worker = { path = "../brain-api-audit-worker" }
audit-chain-core = { path = "../audit-chain-core" }
storage = { path = "../storage" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
