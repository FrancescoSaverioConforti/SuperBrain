[package]
name = "storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain storage layer (placeholder)."

[dependencies]
domain = { path = "../domain" }
policy = { path = "../policy" }
vault-security = { path = "../vault-security" }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
git2 = "0.21"
