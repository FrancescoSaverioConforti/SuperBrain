[package]
name = "storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Private project, not intended for crates.io.
publish = false
description = "SuperBrain storage layer (placeholder)."

[dependencies]
domain = { path = "../domain" }
policy = { path = "../policy" }
vault-security = { path = "../vault-security" }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
git2 = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# "Win32_System_IO" added for B5 remediation M5 Task 2's
# audit_writer::acquire_writer_lock (LockFileEx requires OVERLAPPED,
# defined in that module) -- same windows crate version already used,
# no new dependency.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
