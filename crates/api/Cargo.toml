[package]
name = "api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SuperBrain local read-only core API."

[dependencies]
domain = { path = "../domain" }
storage = { path = "../storage" }
index = { path = "../index" }
policy = { path = "../policy" }
uuid = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
git2 = "0.21"
vault-security = { path = "../vault-security" }
